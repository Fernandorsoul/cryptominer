[package]
name = "cryptominer"
version = "0.1.0"
edition = "2021"
description = "Multi-coin solo cryptocurrency miner manager"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP client for daemon RPC
reqwest = { version = "0.12", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TUI
crossterm = { version = "0.28", features = ["event-stream"] }
indicatif = "0.17"

# Crypto / hashing
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
rust-randomx = "0.7"

# Parallelism
rayon = "1.10"

# Error handling
anyhow = "1"
thiserror = "1"

# Time
chrono = "0.4"

# Async trait
async-trait = "0.1"

# HTTP API server
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

# SQLite persistence
rusqlite = { version = "0.32", features = ["bundled"] }